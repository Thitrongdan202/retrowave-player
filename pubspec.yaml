name: retrowave_player
description: "RetroWave Player — offline-first personal media player. Phases 1–6."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Audio playback
  just_audio: ^0.10.6

  # Android background audio service
  audio_service: ^0.18.19

  # File/folder selection
  file_picker: ^12.0.0

  # Lightweight persistence (selected folder, prefs)
  shared_preferences: ^2.3.0

  # Reactive streams utilities
  rxdart: ^0.27.7

  # Path utilities
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
